# Temporary: checks HOMEBREW_TAP_DEPLOY_KEY can write to the tap. Remove after use.
name: tap-key-check

on:
  push:
    branches: [initial-dev]

permissions:
  contents: read

jobs:
  tap-key-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: fireflycons/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Dry-run push (needs write access; changes nothing)
        working-directory: tap
        run: |
          git remote -v
          git push --dry-run origin HEAD:refs/heads/deploy-key-check
