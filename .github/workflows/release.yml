name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.pull_request.merged && !contains(github.event.pull_request.title, '[no release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Full history and tags, so the release notes can list commits since the last release.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

      - name: Build
        id: build
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="git-remote-codecommit_${v}_${os}_${arch}"
              bin=git-remote-codecommit
              [ "$os" = windows ] && bin="$bin.exe"
              mkdir -p "build/$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "build/$name/$bin" .
              cp README.md LICENSE NOTICE "build/$name/"
              if [ "$os" = windows ]; then
                (cd "build/$name" && zip -q "../../dist/$name.zip" "$bin" README.md LICENSE NOTICE)
              else
                tar -czf "dist/$name.tar.gz" -C "build/$name" .
              fi
            done
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist

      # Lists every non-merge commit on main since the previous v* tag
      # (all history for the first release).
      - name: Write release notes
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$MERGE_SHA^" 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "## Commits since $prev"
              range="$prev..$MERGE_SHA"
            else
              echo "## Commits"
              range="$MERGE_SHA"
            fi
            echo
            git log --no-merges --pretty='tformat:- %s (%h)' "$range"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...v$VERSION"
            fi
          } > "$notes"
          cat "$notes"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --target "$MERGE_SHA" --title "v$VERSION" --notes-file "$NOTES_FILE"

  # Re-runnable on its own: updates the formula from the published GitHub release.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - run: gh release download "v$VERSION" --pattern SHA256SUMS
      - uses: actions/checkout@v5
        with:
          repository: fireflycons/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update formula
        run: |
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$VERSION" SHA256SUMS > tap/Formula/git-remote-codecommit.rb
          cd tap
          git add Formula/git-remote-codecommit.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "git-remote-codecommit $VERSION"
          git push

  # Re-runnable on its own: packages the binaries from the published GitHub release.
  # To resubmit a rejected package, run the chocolatey workflow by hand (see README).
  chocolatey:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/chocolatey.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit
