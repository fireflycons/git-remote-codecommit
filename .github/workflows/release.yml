name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.pull_request.merged && !contains(github.event.pull_request.title, '[no release]') }}
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

      - name: Build
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="git-remote-codecommit_${v}_${os}_${arch}"
              bin=git-remote-codecommit
              [ "$os" = windows ] && bin="$bin.exe"
              mkdir -p "build/$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "build/$name/$bin" .
              cp README.md LICENSE NOTICE "build/$name/"
              if [ "$os" = windows ]; then
                (cd build/$name && zip -q "../../dist/$name.zip" *)
              else
                tar -czf "dist/$name.tar.gz" -C "build/$name" .
              fi
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --target "$MERGE_SHA" --title "v$VERSION" --generate-notes
